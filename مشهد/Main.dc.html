<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>انضم إلى فريقنا</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F3E9D8}
a{color:#8E2F1F}a:hover{color:#5E1D12}
*{box-sizing:border-box}
.field{width:100%;height:56px;padding:0 18px;border:1.5px solid #CDB894;border-radius:12px;background:#FBF6EC;font:500 17px 'IBM Plex Sans Arabic',sans-serif;color:#2A1A12;outline:none;transition:border-color .25s,box-shadow .25s}
.field::placeholder{color:#9A8566}
.field:focus{border-color:#8E2F1F;box-shadow:0 0 0 4px rgba(142,47,31,.12)}
.field--err{border-color:#B3261E;background:#FCEFEA}
.ltr{direction:ltr;text-align:right;letter-spacing:.04em}

.btn{width:100%;height:56px;border:0;border-radius:12px;background:#8E2F1F;color:#FBF6EC;font:600 18px 'IBM Plex Sans Arabic',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .3s,transform .15s}
.btn:hover{background:#74251A}
.btn:active{transform:scale(.98)}
.btn .arrow{display:flex;transition:transform .35s cubic-bezier(.5,0,.2,1)}
.is-sending .btn .arrow{transform:translateX(-8px)}

/* the card: its content settles out, the card hands over to the envelope, then returns fresh */
.card{position:relative;width:100%;background:#FBF6EC;border:1px solid #E2D2B4;border-radius:20px;box-shadow:0 1px 0 #fff inset,0 24px 48px -24px rgba(74,44,20,.35)}
.card-body{transition:opacity .5s ease .15s,transform .6s cubic-bezier(.2,.7,.2,1) .1s}
.is-sending .card-body{opacity:0;transform:scale(.97);transition:opacity .3s ease .08s,transform .35s cubic-bezier(.4,0,.2,1) .05s}
.is-sending .card{animation:hide 0s linear .42s forwards}
@keyframes hide{to{opacity:0}}
.is-back .card{animation:cardIn .8s cubic-bezier(.2,.75,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.is-back .frow,.is-back .brow{animation:rowIn .7s cubic-bezier(.2,.7,.2,1) both}
.is-back .frow:nth-child(1){animation-delay:.2s}
.is-back .frow:nth-child(2){animation-delay:.3s}
.is-back .brow{animation-delay:.4s}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.env-wrap{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
.is-sending .env-wrap{animation:show 0s linear .42s forwards}
@keyframes show{to{opacity:1}}
.env-fly{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.is-sending .env-fly{animation:flight 1.1s 1.75s both}
@keyframes flight{
  0%{transform:none;animation-timing-function:cubic-bezier(.3,0,.3,1)}
  22%{transform:translateY(10px) scale(1.03);animation-timing-function:cubic-bezier(.6,0,.75,.3)}
  82%{opacity:1}
  100%{opacity:0;transform:translateY(-760px) rotate(-7deg) scale(.55)}
}
.env{position:relative;width:100%;height:100%;background:#FBF6EC;border:1px solid #E2D2B4;border-radius:20px;box-shadow:0 1px 0 #fff inset,0 24px 48px -24px rgba(74,44,20,.35);overflow:hidden}
.is-sending .env{animation:shrink .8s cubic-bezier(.65,0,.35,1) .45s both}
@keyframes shrink{
  from{width:100%;height:100%;border-radius:20px;background:#FBF6EC}
  to{width:240px;height:156px;border-radius:10px;background:#F4E7CF;box-shadow:0 1px 0 #fff inset,0 18px 30px -14px rgba(74,44,20,.45)}
}
.env-stripe{position:absolute;top:0;left:0;right:0}
.is-sending .env-stripe{animation:fadeOut .35s ease .55s forwards}
@keyframes fadeOut{to{opacity:0}}
.env-art{position:absolute;top:50%;left:50%;width:240px;height:156px;margin:-78px 0 0 -120px;overflow:visible}
.flap-fill{opacity:0}
.is-sending .flap-fill{animation:fadeIn .45s ease 1.25s forwards}
@keyframes fadeIn{to{opacity:1}}
.flap-line{stroke-dasharray:300;stroke-dashoffset:300}
.is-sending .flap-line{animation:draw .55s cubic-bezier(.4,0,.2,1) 1.1s forwards}
.fold-line{stroke-dasharray:130;stroke-dashoffset:130}
.is-sending .fold-line{animation:draw .5s cubic-bezier(.4,0,.2,1) 1.15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.seal{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0) rotate(-45deg)}
.is-sending .seal{animation:sealPop .45s cubic-bezier(.3,1.6,.5,1) 1.45s forwards}
@keyframes sealPop{to{transform:scale(1) rotate(0)}}

.trail{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#C9962E;opacity:0}
.is-sending .trail{animation:trailUp 1s cubic-bezier(.55,0,.3,1) 2.05s both}
.is-sending .trail:nth-child(2){animation-delay:2.15s;width:4px;height:4px;margin-left:12px}
.is-sending .trail:nth-child(3){animation-delay:2.25s;width:4px;height:4px;margin-left:-16px}
@keyframes trailUp{0%{opacity:0;transform:translateY(0)}30%{opacity:.9}100%{opacity:0;transform:translateY(-320px)}}

.fade-in{animation:rowIn .6s cubic-bezier(.2,.7,.2,1) both}
.star-spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</helmet>
<div class="{{stageCls}}" style="min-height: 100vh; display: flex; flex-direction: column; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #2A1A12; background: #F3E9D8; overflow: hidden">
  <svg width="100%" height="30" aria-hidden="true" style="display: block">
    <defs>
      <pattern id="saduTop" width="60" height="30" patternUnits="userSpaceOnUse">
        <rect width="60" height="30" fill="#8E2F1F"></rect>
        <rect width="60" height="3" fill="#2A1A12"></rect>
        <rect y="27" width="60" height="3" fill="#2A1A12"></rect>
        <polygon points="30,5 48,15 30,25 12,15" fill="#2A1A12"></polygon>
        <polygon points="30,10 39,15 30,20 21,15" fill="#F3E9D8"></polygon>
        <polygon points="0,5 6,15 0,25" fill="#C9962E"></polygon>
        <polygon points="60,5 54,15 60,25" fill="#C9962E"></polygon>
      </pattern>
      <pattern id="saduCard" width="20" height="10" patternUnits="userSpaceOnUse">
        <rect width="20" height="10" fill="#2A1A12"></rect>
        <polygon points="0,10 10,0 20,10" fill="#8E2F1F"></polygon>
        <polygon points="6,10 10,6 14,10" fill="#C9962E"></polygon>
      </pattern>
    </defs>
    <rect width="100%" height="30" fill="url(#saduTop)"></rect>
  </svg>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 16px 56px">
    <header style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 560px">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <g class="star-spin">
          <rect x="14" y="14" width="36" height="36" fill="none" stroke="#C9962E" stroke-width="2.5"></rect>
          <rect x="14" y="14" width="36" height="36" fill="none" stroke="#C9962E" stroke-width="2.5" transform="rotate(45 32 32)"></rect>
        </g>
        <circle cx="32" cy="32" r="8" fill="#8E2F1F"></circle>
      </svg>
      <p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; color: #8E2F1F">فرص وظيفية</p>
      <h1 style="margin: 0; font-family: 'Reem Kufi', sans-serif; font-weight: 700; font-size: clamp(34px, 6vw, 52px); line-height: 1.2; color: #2A1A12">انضم إلى فريقنا</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.8; color: #5C4632">نبحث عن أصحاب الشغف ممن يعتزّون بأصالتنا ويصنعون مستقبلنا. اترك اسمك ورقم جوالك، وسنتواصل معك قريبًا.</p>
    </header>

    <div style="position: relative; width: 100%; max-width: 480px">
      <section class="card">
        <div class="card-body">
          <div style="border-radius: 19px 19px 0 0; overflow: hidden">
            <svg width="100%" height="10" aria-hidden="true" style="display: block"><rect width="100%" height="10" fill="url(#saduCard)"></rect></svg>
          </div>
          <form onSubmit="{{submit}}" novalidate="novalidate" style="display: flex; flex-direction: column; gap: 22px; padding: 32px 28px 30px">
            <div class="frow" style="display: flex; flex-direction: column; gap: 8px">
              <label for="fullName" style="font-size: 15px; font-weight: 600; color: #3B2418">الاسم الكامل</label>
              <input id="fullName" class="{{nameCls}}" type="text" autocomplete="name" placeholder="مثال: عبدالله محمد" value="{{name}}" readOnly="{{locked}}" onInput="{{onName}}">
              <sc-if value="{{nameErr}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 14px; color: #B3261E">{{nameErr}}</span>
              </sc-if>
            </div>
            <div class="frow" style="display: flex; flex-direction: column; gap: 8px">
              <label for="phone" style="font-size: 15px; font-weight: 600; color: #3B2418">رقم الجوال</label>
              <input id="phone" class="{{phoneCls}}" type="tel" inputMode="numeric" autocomplete="tel" placeholder="05XXXXXXXX" maxLength="14" value="{{phone}}" readOnly="{{locked}}" onInput="{{onPhone}}">
              <sc-if value="{{phoneErr}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 14px; color: #B3261E">{{phoneErr}}</span>
              </sc-if>
            </div>
            <div class="brow" style="display: flex; flex-direction: column; gap: 16px; padding-top: 6px">
              <button type="submit" class="btn" aria-label="{{btnLabel}}">
                إرسال الطلب
                <span class="arrow" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
                </span>
              </button>
              <div role="status" aria-live="polite">
                <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
                  <p class="fade-in" style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #8E2F1F">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.8 2.8L16 10"></path></svg>
                    وصل طلبك يا {{firstName}} · <span style="direction: ltr; unicode-bidi: isolate">{{ref}}</span>
                  </p>
                </sc-if>
                <sc-if value="{{noToast}}" hint-placeholder-val="{{ true }}">
                  <p class="fade-in" style="margin: 0; font-size: 13px; text-align: center; color: #7A6248">بياناتك محفوظة ولن تُستخدم إلا لأغراض التوظيف.</p>
                </sc-if>
              </div>
            </div>
          </form>
        </div>
      </section>

      <div class="env-wrap" aria-hidden="true">
        <span class="trail"></span>
        <span class="trail"></span>
        <span class="trail"></span>
        <div class="env-fly">
          <div class="env">
            <svg class="env-stripe" width="100%" height="10"><rect width="100%" height="10" fill="url(#saduCard)"></rect></svg>
            <svg class="env-art" viewBox="0 0 240 156">
              <path class="fold-line" d="M1 155 L100 74" fill="none" stroke="#D9C39B" stroke-width="1.4" stroke-linecap="round"></path>
              <path class="fold-line" d="M239 155 L140 74" fill="none" stroke="#D9C39B" stroke-width="1.4" stroke-linecap="round"></path>
              <path class="flap-fill" d="M0 0 L120 86 L240 0 Z" fill="#EAD8B6"></path>
              <path class="flap-line" d="M1 1 L120 86 L239 1" fill="none" stroke="#BF9D68" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
              <g class="seal">
                <circle cx="120" cy="86" r="17" fill="#8E2F1F"></circle>
                <circle cx="120" cy="86" r="12.5" fill="none" stroke="#C9962E" stroke-width="1.1"></circle>
                <rect x="114.5" y="80.5" width="11" height="11" fill="#C9962E"></rect>
                <rect x="114.5" y="80.5" width="11" height="11" fill="#C9962E" transform="rotate(45 120 86)"></rect>
                <circle cx="120" cy="86" r="2.4" fill="#8E2F1F"></circle>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <p style="margin: 0; font-size: 13px; color: #7A6248">[اسم الجهة] · جميع الحقوق محفوظة</p>
  </main>

  <svg width="100%" height="30" aria-hidden="true" style="display: block">
    <rect width="100%" height="30" fill="url(#saduTop)"></rect>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'form', name: '', phone: '', nameErr: '', phoneErr: '', toast: false, firstName: '', ref: '' };
    this.timers = [];
  }
  componentWillUnmount() { this.clearTimers(); }
  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  digits(s) {
    return String(s).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/\D/g, '');
  }
  normalizePhone(s) {
    var d = this.digits(s);
    if (/^9665\d{8}$/.test(d)) d = '0' + d.slice(3);
    if (/^5\d{8}$/.test(d)) d = '0' + d;
    return /^05\d{8}$/.test(d) ? d : null;
  }
  renderVals() {
    var s = this.state;
    var self = this;
    return {
      stageCls: s.step === 'sending' ? 'is-sending' : s.step === 'back' ? 'is-back' : '',
      locked: s.step === 'sending',
      btnLabel: s.step === 'sending' ? 'جارٍ الإرسال' : 'إرسال الطلب',
      name: s.name,
      phone: s.phone,
      nameErr: s.nameErr,
      phoneErr: s.phoneErr,
      nameCls: s.nameErr ? 'field field--err' : 'field',
      phoneCls: s.phoneErr ? 'field field--err ltr' : 'field ltr',
      toast: s.toast,
      noToast: !s.toast,
      firstName: s.firstName,
      ref: s.ref,
      onName: function (e) { self.setState({ name: e.target.value, nameErr: '' }); },
      onPhone: function (e) { self.setState({ phone: e.target.value, phoneErr: '' }); },
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (s.step === 'sending') return;
        var name = s.name.trim().replace(/\s+/g, ' ');
        var phone = self.normalizePhone(s.phone);
        var nameErr = name.length < 3 ? 'فضلًا اكتب اسمك الكامل' : '';
        var phoneErr = phone ? '' : 'أدخل رقم جوال صحيح يبدأ بـ 05 ومكوّن من 10 أرقام';
        if (nameErr || phoneErr) { self.setState({ nameErr: nameErr, phoneErr: phoneErr }); return; }
        self.clearTimers();
        self.setState({
          step: 'sending',
          toast: false,
          firstName: name.split(' ')[0],
          ref: 'JOB-' + String(Math.floor(100000 + Math.random() * 900000))
        });
        self.later(2950, function () { self.setState({ step: 'back', name: '', phone: '', toast: true }); });
        self.later(4000, function () { self.setState({ step: 'form' }); });
        self.later(9000, function () { self.setState({ toast: false }); });
      }
    };
  }
}
</script>
</body>
</html>
